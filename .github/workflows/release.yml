name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Package Flip.app
        run: bash scripts/package_macos.sh

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## 新功能
          - 顶部工具条：翻页、缩放、旋转翻转、画笔 / 箭头 / 矩形 / 文字标注、存储、打印
          - 向左 / 向右旋转 90°（⌘L / ⌘R）、水平 / 垂直翻转
          - 拷贝、存储 / 存储为（按原图分辨率写入）、打印（⌘P）

          ## 修复
          - 放大以指针/手势位置为焦点，不再往左跳
          - 访达双击打开后窗口到最前

          ## What’s new
          - Top toolbar with rotate, flip, draw, arrow, rectangle, and text markup
          - Copy, Save / Save As at full resolution, Print
          - Zoom around the pointer; Flip comes in front of Finder on open

          ## Notes
          - Universal Intel + Apple Silicon
          EOF
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Flip ${VERSION}" \
            --notes-file release-notes.md \
            "Flip-${VERSION}-macos-universal.zip"
