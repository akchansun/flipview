name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Package Flip.app
        run: bash scripts/package_macos.sh

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## 新功能
          - 向左 / 向右旋转 90°（⌘L / ⌘R）、水平 / 垂直翻转
          - 拷贝图片、存储 / 存储为（按原图分辨率写入，不会用屏幕预览图覆盖文件）
          - 打印（⌘P）；未保存更改时翻页、打开或退出会询问

          ## 修复
          - 放大以指针/手势位置为焦点，不再往左跳
          - 访达双击打开后窗口到最前（现有窗口认领打开事件）

          ## What’s new
          - Rotate left/right, flip horizontal/vertical
          - Copy, Save / Save As at full resolution, Print
          - Prompt before discarding unsaved rotate/flip edits

          ## Notes
          - Universal Intel + Apple Silicon
          EOF
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Flip ${VERSION}" \
            --notes-file release-notes.md \
            "Flip-${VERSION}-macos-universal.zip"
