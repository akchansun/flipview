name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Package Flip.app
        run: bash scripts/package_macos.sh

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## 新功能
          - 顶部工具条：翻页、缩放、旋转翻转、裁剪 / 调色 / 改尺寸 / 检查器 / 移除背景、画笔 / 直线 / 箭头 / 矩形 / 圆角矩形 / 椭圆 / 高亮 / 文字、填充、文字背景、颜色、线宽、字号、存储、打印
          - 文字可加微信式彩色圆角背景，字自动用对比色；输入时就能看到底
          - 裁剪可拖八个点、移动选区、Shift 正方形、显示像素尺寸；⌘A 全选，回车或双击裁切
          - 已有文字可再点编辑、改字号；标注可选中后拖动、改色改粗细改填充，形状可拉伸
          - 从剪贴板新建（⌘N）；检查器含 DPI / 相机 / 曝光
          - 向左 / 向右旋转 90°（⌘L / ⌘R）、水平 / 垂直翻转
          - 拷贝、存储 / 存储为（按原图分辨率写入）、打印（⌘P）

          ## 修复
          - 标注 / 裁剪手感更接近「预览」：圆形控点、实心箭头、平滑笔迹、细白裁剪框、文字不再粗描边
          - 文字输入结束立刻回到浏览选择光标，不必再点一次工具
          - 文字点一下就能改，输入框贴着字，不再弹出很大一块也抢不走键盘
          - 最细标注是发丝线；点选和选中虚线贴着笔画外边，不再用大包围盒
          - 标注线条粗细可调；选中后再改色/粗细作用在当前项
          - 撤销按操作回退；选中标注时 Delete 不会误删整张图
          - 标注不再画到顶部工具条上面
          - 放大以指针/手势位置为焦点，不再往左跳
          - 访达双击打开后窗口到最前

          ## What’s new
          - Preview-style crop: eight handles, move the box, Shift for square, live pixel size, ⌘A, Return / double-click to crop
          - Line, rounded rectangle, highlight, fill vs stroke; Shift constrains square / circle / 45°
          - New from Clipboard (⌘N); Remove Background; inspector shows DPI, camera, and exposure
          - WeChat-style text background: colored rounded chip, contrasting ink, live while typing
          - Markup and crop feel closer to Preview: round handles, filled arrows, smoothed ink, hairline crop box
          - After typing, Return or clicking empty space returns to the select / browse cursor
          - Click text once to edit; the field matches the drawn size instead of a huge box
          - Crop, Adjust Color, Adjust Size, and Inspector so you can stay in Flip instead of switching to Preview
          - Thinnest markup is a hairline; hit-test and selection hug the ink, not a padded box
          - Top toolbar with rotate, flip, draw, line, arrow, rectangle, ellipse, highlight, text, color, and line width
          - Existing text can be edited again; markup can be selected, dragged, recolored, and resized
          - Undo follows real actions; Delete removes selected markup instead of the file
          - Copy, Save / Save As at full resolution, Print
          - Markup stays on the photo (not over the toolbar)
          - Zoom around the pointer; Flip comes in front of Finder on open

          ## Notes
          - Universal Intel + Apple Silicon
          EOF
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Flip ${VERSION}" \
            --notes-file release-notes.md \
            "Flip-${VERSION}-macos-universal.zip"
